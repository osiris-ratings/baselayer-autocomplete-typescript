<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="arch-title arch-desc"><title id="arch-title">How the SDK fits between your page, your backend and Baselayer</title><desc id="arch-desc">The browser runs the SDK. It asks your backend&#x27;s mint endpoint for a session; your backend mints it from Baselayer with your API key and the page&#x27;s Origin. Keystrokes then go from the browser straight to Baselayer&#x27;s autocomplete tier with the session in a header, bypassing your backend. On pick, your form carries the business token to your backend, which sends it with its search.</desc><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="arch-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#384ce3"></path></marker><marker id="arch-head-return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7b8db3"></path></marker></defs><g><rect x="0.5" y="0.5" width="339" height="499" rx="2" fill="#ffffff" stroke="#dce5f5"></rect><line x1="0" y1="46" x2="340" y2="46" stroke="#dce5f5"></line><text x="20" y="29" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="12.5" letter-spacing="0.08em" fill="#1c1b1c">THE BROWSER</text><text x="320" y="29" text-anchor="end" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="11.5" fill="#676b76">app.example.com</text></g><g><rect x="390.5" y="0.5" width="339" height="499" rx="2" fill="#f7f9fe" stroke="#dce5f5"></rect><line x1="390" y1="46" x2="730" y2="46" stroke="#dce5f5"></line><text x="410" y="29" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="12.5" letter-spacing="0.08em" fill="#1c1b1c">YOUR BACKEND</text><text x="710" y="29" text-anchor="end" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="11.5" fill="#676b76">your server</text></g><g><rect x="780.5" y="0.5" width="339" height="499" rx="2" fill="#e9f0fc" stroke="#dce5f5"></rect><line x1="780" y1="46" x2="1120" y2="46" stroke="#dce5f5"></line><text x="800" y="29" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="12.5" letter-spacing="0.08em" fill="#1c1b1c">BASELAYER</text><text x="1100" y="29" text-anchor="end" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="11.5" fill="#676b76">api.baselayer.com</text></g><rect x="20" y="62" width="300" height="422" rx="3" fill="#ffffff" stroke="#cfd9ee"></rect><line x1="20" y1="86" x2="320" y2="86" stroke="#cfd9ee"></line><circle cx="34" cy="74" r="3.5" fill="#d6deee"></circle><circle cx="46" cy="74" r="3.5" fill="#d6deee"></circle><circle cx="58" cy="74" r="3.5" fill="#d6deee"></circle><text x="72" y="78" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="10.5" fill="#676b76">app.example.com/onboarding</text><rect x="36" y="102" width="268" height="236" rx="2" fill="#f1f6fd" stroke="#384ce3"></rect><text x="52" y="126" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="12.5" fill="#384ce3">&lt;BusinessAutocomplete /&gt;</text><text x="52" y="144" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12" fill="#676b76">@baselayer-sdk/autocomplete/react</text><rect x="52" y="156" width="236" height="34" rx="3" fill="#ffffff" stroke="#384ce3"></rect><text x="64" y="178" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="14" fill="#1c1b1c">harbor concrete pum</text><line x1="204" y1="165" x2="204" y2="183" stroke="#1c1b1c" stroke-width="1.25"></line><rect x="52" y="194" width="236" height="78" rx="3" fill="#ffffff" stroke="#dce5f5"></rect><text x="64" y="214" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#1c1b1c">HARBOR CONCRETE PUMPING CO., INC.</text><line x1="64" y1="217" x2="201" y2="217" stroke="#38a169" stroke-width="1.5"></line><text x="64" y="230" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="10" fill="#676b76">1200 River Rd, Pittsburgh, PA 15212</text><text x="64" y="250" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#1c1b1c">HARBOR CONCRETE SUPPLY, INC.</text><line x1="64" y1="253" x2="201" y2="253" stroke="#38a169" stroke-width="1.5"></line><text x="64" y="266" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="10" fill="#676b76">15 Ferry St, Newark, NJ 07105</text><text x="52" y="298" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="0.06em" fill="#676b76">SESSION · REFRESH · BACKOFF</text><text x="52" y="318" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="0.06em" fill="#676b76">EVERY REFUSAL HANDLED</text><rect x="36" y="358" width="268" height="110" rx="2" fill="#ffffff" stroke="#cfd9ee"></rect><text x="52" y="382" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="12.5" fill="#1c1b1c">your form</text><text x="52" y="402" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#676b76">the name, plus the row&#x27;s business_token</text><rect x="52" y="420" width="92" height="30" rx="2" fill="#384ce3"></rect><text x="98" y="439" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="11" letter-spacing="0.06em" fill="#ffffff">SUBMIT</text><g><rect x="410" y="112" width="300" height="108" rx="2" fill="#ffffff" stroke="#cfd9ee"></rect><text x="426" y="138" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="13" fill="#1c1b1c">POST /api/ac-session</text><text x="426" y="160" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="13" fill="#676b76">Your route, behind your own login</text></g><rect x="426" y="170" width="268" height="32" rx="2" fill="#f1f6fd" stroke="#cfd9ee"></rect><g transform="translate(438 178)" stroke="#384ce3" stroke-width="1.5" fill="none"><circle cx="5" cy="8" r="4"></circle><path d="M9 8 H18 M15 8 V11 M18 8 V12"></path></g><text x="464" y="191" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="11" letter-spacing="0.04em" fill="#1c1b1c">BASELAYER_API_KEY STAYS HERE</text><text x="560" y="268" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="0.05em" fill="#384ce3">KEYSTROKES GO STRAIGHT TO BASELAYER</text><text x="560" y="326" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="0.05em" fill="#676b76">NO COOKIES · NO KEY · NOT THROUGH HERE</text><g><rect x="410" y="372" width="300" height="96" rx="2" fill="#ffffff" stroke="#cfd9ee"></rect><text x="426" y="398" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="13" fill="#1c1b1c">your search handler</text><text x="426" y="420" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="13" fill="#676b76">Adds the token to its search call</text><text x="426" y="454" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="0.06em" fill="#384ce3">X-API-KEY FROM YOUR SERVER</text></g><g><rect x="800" y="112" width="300" height="108" rx="2" fill="#ffffff" stroke="#cfd9ee"></rect><text x="816" y="138" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="13" fill="#1c1b1c">POST /autocomplete/sessions</text><text x="816" y="160" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="13" fill="#676b76">Mints a session bound to the</text><text x="816" y="178" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="13" fill="#676b76">page&#x27;s Origin</text><text x="816" y="206" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="0.06em" fill="#384ce3">201 · MINUTES LONG · BUDGETED</text></g><g><rect x="800" y="248" width="300" height="80" rx="2" fill="#ffffff" stroke="#cfd9ee"></rect><text x="816" y="274" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="13" fill="#1c1b1c">GET /autocomplete/businesses</text><text x="816" y="296" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="13" fill="#676b76">Rows for every keystroke</text></g><g><rect x="800" y="372" width="300" height="96" rx="2" fill="#ffffff" stroke="#cfd9ee"></rect><text x="816" y="398" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="13" fill="#1c1b1c">POST /searches</text><text x="816" y="420" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="13" fill="#676b76">Resolves to exactly the business</text><text x="816" y="438" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="13" fill="#676b76">that was picked</text></g><line x1="304" y1="146" x2="408" y2="146" stroke="#384ce3" stroke-width="1.75" marker-end="url(#arch-head)"></line><line x1="408" y1="178" x2="306" y2="178" stroke="#7b8db3" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arch-head-return)"></line><g><circle cx="365" cy="146" r="13" fill="#384ce3"></circle><text x="365" y="150.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="12.5" fill="#ffffff">1</text></g><line x1="712" y1="146" x2="798" y2="146" stroke="#384ce3" stroke-width="1.75" marker-end="url(#arch-head)"></line><line x1="798" y1="178" x2="714" y2="178" stroke="#7b8db3" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arch-head-return)"></line><g><circle cx="755" cy="146" r="13" fill="#384ce3"></circle><text x="755" y="150.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="12.5" fill="#ffffff">2</text></g><line x1="304" y1="284" x2="798" y2="284" stroke="#384ce3" stroke-width="1.75" marker-end="url(#arch-head)"></line><line x1="798" y1="304" x2="306" y2="304" stroke="#7b8db3" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arch-head-return)"></line><g><circle cx="365" cy="284" r="13" fill="#384ce3"></circle><text x="365" y="288.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="12.5" fill="#ffffff">3</text></g><line x1="304" y1="420" x2="408" y2="420" stroke="#384ce3" stroke-width="1.75" marker-end="url(#arch-head)"></line><g><circle cx="365" cy="420" r="13" fill="#384ce3"></circle><text x="365" y="424.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="12.5" fill="#ffffff">4</text></g><line x1="712" y1="420" x2="798" y2="420" stroke="#384ce3" stroke-width="1.75" marker-end="url(#arch-head)"></line><line x1="798" y1="448" x2="714" y2="448" stroke="#7b8db3" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arch-head-return)"></line><g><circle cx="755" cy="420" r="13" fill="#384ce3"></circle><text x="755" y="424.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="12.5" fill="#ffffff">5</text></g></svg>
