<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1098" viewBox="0 0 1120 1098" role="img" aria-labelledby="flow-title"><title id="flow-title">The requests between the browser, your backend and Baselayer, from focus to submit</title><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="flow-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#384ce3"></path></marker><marker id="flow-head-return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7b8db3"></path></marker></defs><g><rect x="0" y="0" width="373.3333333333333" height="1098" fill="#ffffff"></rect><text x="186.66666666666666" y="34" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="13" letter-spacing="0.08em" fill="#1c1b1c">THE BROWSER</text><text x="186.66666666666666" y="56" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="13" fill="#676b76">your page + the SDK</text><line x1="186.66666666666666" y1="84" x2="186.66666666666666" y2="114" stroke="#b9c8e6" stroke-dasharray="3 5"></line><line x1="186.66666666666666" y1="134" x2="186.66666666666666" y2="660" stroke="#b9c8e6" stroke-dasharray="3 5"></line><line x1="186.66666666666666" y1="680" x2="186.66666666666666" y2="1086" stroke="#b9c8e6" stroke-dasharray="3 5"></line></g><g><rect x="373.3333333333333" y="0" width="373.3333333333333" height="1098" fill="#f7f9fe"></rect><text x="560" y="34" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="13" letter-spacing="0.08em" fill="#1c1b1c">YOUR BACKEND</text><text x="560" y="56" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="13" fill="#676b76">one small endpoint</text><line x1="560" y1="84" x2="560" y2="450" stroke="#b9c8e6" stroke-dasharray="3 5"></line><line x1="560" y1="472" x2="560" y2="481" stroke="#b9c8e6" stroke-dasharray="3 5"></line><line x1="560" y1="501" x2="560" y2="514" stroke="#b9c8e6" stroke-dasharray="3 5"></line><line x1="560" y1="536" x2="560" y2="545" stroke="#b9c8e6" stroke-dasharray="3 5"></line><line x1="560" y1="565" x2="560" y2="1086" stroke="#b9c8e6" stroke-dasharray="3 5"></line></g><g><rect x="746.6666666666666" y="0" width="373.3333333333333" height="1098" fill="#e9f0fc"></rect><text x="933.3333333333333" y="34" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="13" letter-spacing="0.08em" fill="#1c1b1c">BASELAYER</text><text x="933.3333333333333" y="56" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="13" fill="#676b76">api.baselayer.com</text><line x1="933.3333333333333" y1="84" x2="933.3333333333333" y2="1086" stroke="#b9c8e6" stroke-dasharray="3 5"></line></g><line x1="0" y1="72" x2="1120" y2="72" stroke="#dce5f5"></line><g><line x1="16" y1="108" x2="1104" y2="108" stroke="#dce5f5"></line><text x="20" y="128" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="11.5" letter-spacing="0.08em" fill="#384ce3">THE FIELD GETS FOCUS: PREWARM</text></g><g><text x="373.3333333333333" y="164" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="12.5" fill="#1c1b1c">POST /api/ac-session</text><line x1="190.66666666666666" y1="174" x2="554" y2="174" stroke="#384ce3" stroke-width="1.75" marker-end="url(#flow-head)"></line><circle cx="186.66666666666666" cy="174" r="3.5" fill="#384ce3"></circle><text x="373.3333333333333" y="193" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#676b76">your cookie rides along (credentials: same-origin)</text></g><g><text x="746.6666666666666" y="228" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="12.5" fill="#1c1b1c">POST /autocomplete/sessions</text><line x1="564" y1="238" x2="927.3333333333333" y2="238" stroke="#384ce3" stroke-width="1.75" marker-end="url(#flow-head)"></line><circle cx="560" cy="238" r="3.5" fill="#384ce3"></circle><text x="746.6666666666666" y="257" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#676b76">X-API-Key · Origin: https://app.example.com</text></g><g><text x="746.6666666666666" y="292" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="12.5" fill="#3d4a6b">201 { session_token, expires_in: 180, … }</text><line x1="929.3333333333333" y1="302" x2="566" y2="302" stroke="#7b8db3" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#flow-head-return)"></line><circle cx="933.3333333333333" cy="302" r="3.5" fill="#7b8db3"></circle><text x="746.6666666666666" y="321" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#676b76">bound to that Origin, with its own request budget</text></g><g><text x="373.3333333333333" y="356" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="12.5" fill="#3d4a6b">201, passed through unchanged</text><line x1="556" y1="366" x2="192.66666666666666" y2="366" stroke="#7b8db3" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#flow-head-return)"></line><circle cx="560" cy="366" r="3.5" fill="#7b8db3"></circle><text x="373.3333333333333" y="385" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#676b76">status, body and Retry-After as Baselayer sent them</text></g><g><line x1="16" y1="410" x2="1104" y2="410" stroke="#dce5f5"></line><text x="20" y="430" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="11.5" letter-spacing="0.08em" fill="#384ce3">AS SOMEONE TYPES</text></g><g><text x="560" y="466" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="12.5" fill="#1c1b1c">GET /autocomplete/businesses?q=howard+concrete+pum</text><line x1="190.66666666666666" y1="476" x2="927.3333333333333" y2="476" stroke="#384ce3" stroke-width="1.75" marker-end="url(#flow-head)"></line><circle cx="186.66666666666666" cy="476" r="3.5" fill="#384ce3"></circle><text x="560" y="495" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#676b76">X-Autocomplete-Session · credentials: omit · never via your backend</text></g><g><text x="560" y="530" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="12.5" fill="#3d4a6b">200 { found: 9, suggestions: [ … ] }</text><line x1="929.3333333333333" y1="540" x2="192.66666666666666" y2="540" stroke="#7b8db3" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#flow-head-return)"></line><circle cx="933.3333333333333" cy="540" r="3.5" fill="#7b8db3"></circle><text x="560" y="559" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#676b76">X-Autocomplete-Index · Server-Timing</text></g><g><rect x="16.666666666666657" y="578" width="340" height="52" rx="2" fill="#ffffff" stroke="#9fb8e6"></rect><text x="186.66666666666666" y="599" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="12" fill="#1c1b1c">A newer keystroke aborts the older request</text><text x="186.66666666666666" y="618" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#676b76">the rows on screen stay until the next answer lands</text></g><g><line x1="16" y1="654" x2="1104" y2="654" stroke="#dce5f5"></line><text x="20" y="674" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="11.5" letter-spacing="0.08em" fill="#384ce3">PAST 80 % OF THE SESSION&#x27;S LIFE</text></g><g><rect x="40" y="694" width="1040" height="66" rx="2" fill="#ffffff" stroke="#384ce3" stroke-dasharray="6 4"></rect><rect x="40" y="694" width="46" height="22" fill="#384ce3"></rect><text x="63" y="709" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="0.08em" fill="#ffffff">REF</text><text x="560" y="722" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="12.5" fill="#1c1b1c">The next keystroke mints a fresh session first: the prewarm again</text><text x="560" y="744" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#676b76">Nobody sees an expiry mid-word. If the refresh fails, the old session keeps serving until it expires.</text></g><g><line x1="16" y1="784" x2="1104" y2="784" stroke="#dce5f5"></line><text x="20" y="804" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="11.5" letter-spacing="0.08em" fill="#384ce3">PICK, THEN SUBMIT</text></g><g><rect x="16.666666666666657" y="824" width="340" height="52" rx="2" fill="#ffffff" stroke="#9fb8e6"></rect><text x="186.66666666666666" y="845" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="12" fill="#1c1b1c">onPick(suggestion, { businessToken })</text><text x="186.66666666666666" y="864" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#676b76">the token is good for 15 minutes</text></g><g><text x="373.3333333333333" y="910" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="12.5" fill="#1c1b1c">your form: name + business_token</text><line x1="190.66666666666666" y1="920" x2="554" y2="920" stroke="#384ce3" stroke-width="1.75" marker-end="url(#flow-head)"></line><circle cx="186.66666666666666" cy="920" r="3.5" fill="#384ce3"></circle></g><g><text x="746.6666666666666" y="974" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="12.5" fill="#1c1b1c">POST /searches</text><line x1="564" y1="984" x2="927.3333333333333" y2="984" stroke="#384ce3" stroke-width="1.75" marker-end="url(#flow-head)"></line><circle cx="560" cy="984" r="3.5" fill="#384ce3"></circle><text x="746.6666666666666" y="1003" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#676b76">{ name, business_token } · X-API-Key</text></g><g><text x="746.6666666666666" y="1038" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="12.5" fill="#3d4a6b">the search, pinned to that business</text><line x1="929.3333333333333" y1="1048" x2="566" y2="1048" stroke="#7b8db3" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#flow-head-return)"></line><circle cx="933.3333333333333" cy="1048" r="3.5" fill="#7b8db3"></circle></g></svg>
